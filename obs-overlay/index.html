<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PawPad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage"><canvas id="retroCanvas" width="122" height="70"></canvas></main>
  <div id="history" class="history" hidden></div>

  <div id="connectionStatus" class="status"><i></i><span id="statusText">Connecting…</span></div>
  <button id="settingsToggleBtn" class="gear">Settings</button>

  <aside id="settingsPanel" class="panel">
    <header>
      <h1>Paw<em>Pad</em></h1>
      <button id="closePanelBtn" aria-label="Close">×</button>
    </header>

    <div class="scroll">
      <details class="grp" data-grp="look" open>
        <summary>Look</summary>
        <div class="body">
          <div class="field">
            <span class="lbl">Controller</span>
            <select id="controllerInput" data-seg><option value="auto">Auto</option><option value="ps">PlayStation</option><option value="xbox">Xbox</option></select>
          </div>
          <div class="field">
            <span class="lbl">Style</span>
            <select id="styleInput" data-seg><option value="classic">Classic</option><option value="fine">Fine</option><option value="bun">Bun</option><option value="cat">Cat</option><option value="fox">Fox</option><option value="dog">Dog</option><option value="wolf">Wolf</option></select>
          </div>
          <div class="field" id="toneRow">
            <span class="lbl">Colors</span>
            <select id="toneInput" data-seg><option value="default">Default</option><option value="midnight">Midnight</option></select>
          </div>
          <div class="field" id="coatRow">
            <span class="lbl" id="coatLabel">Which cat</span>
            <select id="coatInput" data-seg="swatch"></select>
          </div>
          <div class="field">
            <span class="lbl">Theme</span>
            <select id="themeInput" data-seg><option value="default">Default</option><option value="contrast">High contrast</option><option value="night">Night</option><option value="pastel">Pastel</option></select>
          </div>
          <label class="slider"><span>Opacity</span><output id="opacityVal">100%</output>
            <input type="range" id="opacityInput" min="10" max="100" step="5" value="100"></label>
        </div>
      </details>

      <details class="grp" data-grp="motion">
        <summary>Motion</summary>
        <div class="body">
          <label class="switch" title="Calm mode: no bounce, wobble, ear folds or trigger bulge. Shapes still change, but nothing moves."><span>Calm mode</span><input type="checkbox" data-look="calm"><b></b></label>
          <label class="switch" title="Shake the controller hard and the whole pad bounces for a moment. Off in calm mode. Needs motion data from the PS4 plugin."><span>Shake to bounce</span><input type="checkbox" data-look="shake"><b></b></label>
          <div class="row"><button id="shakePreviewBtn" class="mini">Shake preview</button></div>
          <label class="switch" title="Squeeze the triggers: each one shrinks as you pull it."><span>Squeeze triggers</span><input type="checkbox" id="squeezeToggle"><b></b></label>
          <label class="switch" title="Furry styles: a squeezed trigger bulges out a little as you pull it."><span>Trigger bulge</span><input type="checkbox" id="bulgeToggle" checked><b></b></label>
          <label class="switch" title="Furry styles: every pressed button squashes and bulges, then bounces back."><span>Squish buttons</span><input type="checkbox" id="squishToggle"><b></b></label>
          <label class="switch" title="Faint dots that trail the stick cap as it moves."><span>Stick trail</span><input type="checkbox" data-look="trail"><b></b></label>
        </div>
      </details>

      <details class="grp" data-grp="show">
        <summary>On screen</summary>
        <div class="body">
          <label class="switch" title="Names the triggers and bumpers: LT / RT and LB / RB, or L2 / R2 and L1 / R1."><span>Button names</span><input type="checkbox" id="namesToggle" checked><b></b></label>
          <label class="switch" title="Shows the last seven buttons pressed, in the corner of the overlay."><span>Input history</span><input type="checkbox" data-look="history"><b></b></label>
          <label class="switch" title="Fades the controller out after a set time with no input. It comes back on the next press."><span>Auto-hide when idle</span><input type="checkbox" data-look="autohide"><b></b></label>
          <label class="slider" id="hideAfterRow"><span>Hide after</span><output id="hideAfterVal">8 s</output>
            <input type="range" id="hideAfterInput" min="2" max="60" step="1" value="8"></label>
          <label class="slider"><span>Shadow</span><output id="shadowVal">Off</output>
            <input type="range" id="shadowInput" min="0" max="100" step="5" value="0"></label>
          <label class="slider"><span>Frame rate</span><output id="fpsVal">60 fps</output>
            <input type="range" id="fpsInput" min="5" max="60" step="5" value="60"></label>
          <div class="field">
            <span class="lbl">Shape</span>
            <select id="layoutInput" data-seg><option value="normal">Normal</option><option value="wide">Wide</option></select>
          </div>
          <label class="switch"><span id="padLabel">Touchpad</span><input type="checkbox" id="padToggle" checked><b></b></label>
        </div>
      </details>

      <details class="grp" data-grp="signal">
        <summary>Signal</summary>
        <div class="body">
          <div class="field">
            <span class="lbl">Source</span>
            <select id="sourceInput" data-seg><option value="auto">Auto</option><option value="ps4">PS4</option><option value="local">This computer</option></select>
          </div>
          <label class="slider"><span>Capture delay</span><output id="delayVal">0 ms</output>
            <input type="range" id="delayInput" min="0" max="500" step="10" value="0"></label>
          <label class="slider"><span>Stick deadzone</span><output id="deadzoneVal">6%</output>
            <input type="range" id="deadzoneInput" min="0" max="30" step="1" value="6"></label>
          <label class="switch" title="Sends a fake controller to every page, OBS included, so you can place the overlay."><span>Test mode</span><input type="checkbox" id="simulatorToggle"><b></b></label>
          <label class="switch" title="Random presses on this page only, to preview the squish. Turns Test mode on."><span>Button mash (preview)</span><input type="checkbox" id="mashToggle"><b></b></label>
          <div class="field"><span class="lbl">Signal</span><code id="statLine" class="stat">no packets yet</code></div>
          <div class="field"><span class="lbl">PS4 target</span><code id="detectedIp" class="stat">127.0.0.1:9999</code></div>
        </div>
      </details>

      <details class="grp presets" data-grp="presets">
        <summary>Presets</summary>
        <div class="body">
          <div class="row"><input type="text" id="presetName" maxlength="24" placeholder="Name this look"><button id="savePresetBtn" class="mini">Save</button></div>
          <div class="row"><select id="presetSelect" class="mini-select"></select><button id="loadPresetBtn" class="mini">Load</button><button id="deletePresetBtn" class="mini">Delete</button></div>
          <div class="row"><button id="exportBtn" class="mini">Export</button><button id="importBtn" class="mini">Import</button><input type="file" id="importFile" accept="application/json" hidden></div>
          <div class="row"><button id="lookUrlBtn" class="mini">Copy look URL</button><button id="resetBtn" class="mini">Reset to defaults</button></div>
        </div>
      </details>
    </div>

    <button id="copyObsUrlBtn" class="copy">Copy OBS URL</button>
  </aside>

  <script src="retro.js"></script>
  <script src="app.js"></script>
</body>
</html>
